[project]
name = "deadIp"
version = "0.1.0"
description = "Диагностика блокировки IP из РФ (РКН/ТСПУ)"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "dnspython>=2.6",
]

[project.optional-dependencies]
scapy = ["scapy>=2.5"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1.2",
    "twine>=5.0",
    "pyinstaller>=6.0",
    "patchelf>=0.17",
]

[project.scripts]
deadIp = "deadIp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deadIp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]   # длинные строки — на усмотрение, отключим

[tool.ruff.format]
quote-style = "preserve"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
