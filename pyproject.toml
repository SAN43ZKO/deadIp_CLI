[project]
name = "deadIp"
version = "0.1.0"
description = "Диагностика блокировки IP из РФ (РКН/ТСПУ)"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "dnspython>=2.6",
]

[project.optional-dependencies]
scapy = ["scapy>=2.5"]

[project.scripts]
deadIp = "deadIp.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deadIp"]
